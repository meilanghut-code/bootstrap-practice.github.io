<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>Practicing row and column</h1>
    </div>
    <div class="container my-5">
        <div class="row">
            <h2>All breakpoints will display as 3 column</h2>
            <div class="col-4 border">Column 1</div>
            <div class="col-4 border">Column 2</div>
            <div class="col-4 border">Column 3</div>
        </div>
    </div>

    <div class="container my-5">
        <div class="row">
            <h2>All breakpoints will display as 2 column, right column is bigger than left</h2>
            <div class="col-4 border">Column left</div>
            <div class="col-8 border">Column right</div>
        </div>
    </div>

    <div class="container my-5">
        <div class="row">
            <h2>All breakpoints will display as 1 column</h2>
            <div class="col-12 border">Column 1</div>
            <div class="col-12 border">Column 2</div>
            <div class="col-12 border">Column 3</div>
        </div>
    </div>
</body>
</html>
